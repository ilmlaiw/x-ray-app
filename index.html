<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>X-Ray Scanner Lens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        .mono-font {
            font-family: 'Share Tech+Mono', monospace;
        }
        /* Custom X-ray filter applied only inside the draggable lens */
        .xray-filter {
            filter: invert(1) grayscale(1) brightness(1.2) contrast(2) hue-rotate(180deg);
        }
    </style>
</head>
<body class="relative w-screen h-screen flex flex-col items-center justify-between">

    <!-- Top HUD Bar -->
    <div class="absolute top-4 z-20 flex flex-col items-center pointer-events-none">
        <h1 class="mono-font text-cyan-400 text-lg tracking-widest bg-black/60 px-4 py-1 rounded-full border border-cyan-500/30 backdrop-blur-md">X-RAY OPTICAL VIEWFINDER</h1>
        <p class="text-xs text-gray-400 mt-1">Drag the lens to scan objects</p>
    </div>

    <!-- Camera Feed Container -->
    <div id="camera-container" class="relative w-full h-full overflow-hidden bg-black flex items-center justify-center">
        
        <!-- Base Live Camera Video (Normal View) -->
        <video id="webcam" autoplay playsinline muted class="absolute w-full h-full object-cover"></video>

        <!-- Draggable X-Ray Lens Window -->
        <div id="lens" class="absolute w-64 h-64 rounded-full border-2 border-cyan-400 shadow-[0_0_30px_rgba(0,255,255,0.5)] overflow-hidden cursor-grab active:cursor-grabbing z-10" style="left: calc(50% - 8rem); top: calc(50% - 8rem);">
            
            <!-- Mirrored Video Feed inside the Lens with X-Ray Filter -->
            <video id="lens-video" autoplay playsinline muted class="absolute object-cover xray-filter pointer-events-none"></video>
            
            <!-- Reticle Crosshair Overlay inside Lens -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <div class="w-full h-[1px] bg-cyan-400/50"></div>
                <div class="absolute h-full w-[1px] bg-cyan-400/50"></div>
                <div class="absolute w-8 h-8 border border-cyan-400/80 rounded-full"></div>
            </div>

            <!-- Lens HUD Data Tag -->
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 mono-font text-[10px] text-cyan-300 bg-black/70 px-2 py-0.5 rounded tracking-wider">
                SCANNING...
            </div>
        </div>
    </div>

    <!-- Permission / Start Overlay -->
    <div id="permission-screen" class="absolute inset-0 z-50 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 bg-cyan-500/10 text-cyan-400 rounded-full flex items-center justify-center mb-4 text-2xl">
                📷
            </div>
            <h2 class="text-xl font-semibold mb-2 text-white">Camera Access Required</h2>
            <p class="text-sm text-gray-400 mb-6">This app requires rear camera permissions on your device to display the live X-ray optical scanner.</p>
            <button id="start-btn" class="w-full py-3 px-6 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl transition-all shadow-lg shadow-cyan-500/20">
                Grant Access & Start Scanner
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const lensVideo = document.getElementById('lens-video');
        const startBtn = document.getElementById('start-btn');
        const permissionScreen = document.getElementById('permission-screen');
        const lens = document.getElementById('lens');
        const container = document.getElementById('camera-container');

        let currentStream = null;

        async function startCamera() {
            try {
                const constraints = {
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                lensVideo.srcObject = currentStream;
                permissionScreen.style.display = 'none';
                
                // Sync video dimensions for the lens offset calculation
                video.onloadedmetadata = () => {
                    lensVideo.width = video.videoWidth;
                    lensVideo.height = video.videoHeight;
                };
            } catch (err) {
                alert("Camera access denied or unavailable. Please check browser permissions.");
                console.error(err);
            }
        }

        startBtn.addEventListener('click', startCamera);

        // Make the lens draggable via mouse and touch gestures
        let isDragging = false;
        let startX, startY;

        function dragStart(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - lens.offsetLeft;
            startY = clientY - lens.offsetTop;
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let newX = clientX - startX;
            let newY = clientY - startY;

            // Keep lens within screen bounds
            const maxX = window.innerWidth - lens.offsetWidth;
            const maxY = window.innerHeight - lens.offsetHeight;
            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));

            lens.style.left = newX + 'px';
            lens.style.top = newY + 'px';

            // Dynamically match the background video position inside the lens window
            lensVideo.style.left = -newX + 'px';
            lensVideo.style.top = -newY + 'px';
            lensVideo.style.width = container.offsetWidth + 'px';
            lensVideo.style.height = container.offsetHeight + 'px';
        }

        function dragEnd() {
            isDragging = false;
        }

        lens.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', dragEnd);

        lens.addEventListener('touchstart', dragStart);
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', dragEnd);
    </script>
</body>
</html>
